name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: |
          cp target/release/pmcu pmcu-linux
          zip -r pmcu-skill.zip SKILL.md scripts/
      - uses: actions/upload-artifact@v4
        with:
          name: assets-linux
          path: |
            pmcu-linux
            pmcu-skill.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: Copy-Item target/release/pmcu.exe pmcu-windows.exe
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: assets-windows
          path: pmcu-windows.exe

  publish:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: assets-linux
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: assets-windows
          path: assets
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/pmcu-linux
            assets/pmcu-windows.exe
            assets/pmcu-skill.zip
